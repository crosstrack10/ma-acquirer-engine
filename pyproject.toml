[project]
name = "acquirer-engine"
version = "0.1.0"
description = "M&A Acquirer Identification Engine for William Blair AI Innovation Team"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "streamlit>=1.35",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
